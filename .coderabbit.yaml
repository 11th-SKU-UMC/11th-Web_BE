# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# ============================================================ #
#                       기본 및 언어 설정                         #
# ============================================================ #

# 리뷰와 채팅에 사용할 기본 언어
language: "ko-KR"

# 검증되지 않은 실험 기능은 사용하지 않음
early_access: false

# 리뷰 기준은 엄격하게, 설명은 초보자 친화적으로 제공
# > 블록의 여러 줄은 공백으로 이어진 하나의 문자열로 전달됨
# CodeRabbit 제한: 최대 250자 / 현재: 224자
tone_instructions: >
  풀스택 시니어 개발자 관점에서 꼼꼼하고 근거 있게 검토합니다.
  초보자가 이해할 수 있도록 문제의 원인과 구체적인 수정 방향을 친절하고 간결하게 설명하고,
  필수 수정과 선택 개선을 구분합니다.
  스타일보다 버그, 안정성, 보안, 성능, 유지보수성을 우선합니다.
  코드 식별자는 원문을 유지하고 나머지는 한국어로 작성합니다.
  정답 코드를 통째로 제공하기보다 학습자가 스스로 고칠 수 있는 힌트를 우선합니다.

# ============================================================ #
#                          리뷰 상세 설정                         #
# ============================================================ #

reviews:
  # 말투는 과도하게 공격적이지 않게 유지하되 실질적인 문제를 꼼꼼히 검토
  profile: "chill"

  # CodeRabbit이 PR을 자동 승인하는 워크플로우는 사용하지 않음
  request_changes_workflow: false

  # ---------------------------------------------------------- #
  #                       요약 및 표시 설정                       #
  # ---------------------------------------------------------- #

  # PR 전체 변경 사항의 고수준 요약을 제공
  high_level_summary: true

  # 변경된 파일별 요약을 제공
  changed_files_summary: true

  # 긴 Walkthrough 영역을 기본적으로 접어서 표시
  collapse_walkthrough: true

  # 학습용 PR에 불필요한 시퀀스 다이어그램은 생성하지 않음
  sequence_diagrams: false

  # 리뷰 완료·생략 등 상태 메시지를 Walkthrough에 표시
  review_status: true

  # 무시된 파일·추가 컨텍스트 등 내부 세부 정보는 별도로 출력하지 않음
  review_details: false

  # PR 요약에 시(poem)를 생성하지 않음
  poem: false

  # AI 에이전트가 바로 적용할 정답형 수정 프롬프트를 제공하지 않음
  enable_prompt_for_ai_agents: false

  # ---------------------------------------------------------- #
  #                    이슈·PR·레이블 연동 설정                    #
  # ---------------------------------------------------------- #

  # 연결된 Issue의 요구사항이 PR에 반영됐는지 검토
  assess_linked_issues: true

  # 관련 Issue와 과거 PR을 별도로 추천하지 않음
  related_issues: false
  related_prs: false

  # 레이블 및 리뷰어를 추천하거나 자동 적용·할당하지 않음
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false

  # ---------------------------------------------------------- #
  #                    경로별 학습 리뷰 지침                       #
  # ---------------------------------------------------------- #

  # 해당 파일이 존재할 때만 언어·프레임워크별 지침을 추가 적용
  path_instructions:
    - path: "src/main/java/**"
      instructions: >
        Java/Spring 코드의 입력값 검증, 예외 처리, 인증·인가, 트랜잭션 경계와 계층 간 책임 분리를 중점적으로 확인하세요.
    - path: "**/*.{ts,tsx,js,jsx}"
      instructions: >
        JavaScript/TypeScript 코드의 타입 안정성, 비동기 오류 처리, 입력값 검증, 상태와 부수효과 관리를 중점적으로 확인하세요.
    - path: "**/*.dart"
      instructions: >
        Dart/Flutter 코드의 null safety, 비동기 오류 처리, 위젯 생명주기, 상태 관리와 불필요한 rebuild를 중점적으로 확인하세요.
    - path: "**/*Test.*"
      instructions: >
        테스트가 정상 동작뿐 아니라 경계값, 실패 케이스와 예외 상황도 충분히 검증하는지 확인하세요.
    - path: "**/*.{test,spec}.*"
      instructions: >
        테스트가 정상 동작뿐 아니라 경계값, 실패 케이스와 예외 상황도 충분히 검증하는지 확인하세요.
    - path: "**/test/**"
      instructions: >
        테스트가 정상 동작뿐 아니라 경계값, 실패 케이스와 예외 상황도 충분히 검증하는지 확인하세요.

  # CodeRabbit 기본 필터가 lock·build·dist·generated 파일을 이미 제외하므로
  # 중복되는 사용자 정의 path_filters는 추가하지 않음

  # ---------------------------------------------------------- #
  #                       자동 리뷰 설정                          #
  # ---------------------------------------------------------- #

  auto_review:
    # 조건에 맞는 PR이 생성되면 자동으로 리뷰
    enabled: true

    # PR에 새 커밋이 push되면 변경된 부분을 중심으로 추가 리뷰
    auto_incremental_review: true

    # 한 PR에서 자동 리뷰 5회 후 일시 정지하여 불필요한 리뷰 소모를 방지
    auto_pause_after_reviewed_commits: 5

    # Draft PR은 리뷰하지 않고 Ready 상태가 된 뒤 리뷰
    drafts: false

    # main뿐 아니라 모든 닉네임 브랜치를 PR 대상 브랜치로 허용
    base_branches:
      - ".*"

    # 특정 레이블을 요구하지 않음
    labels: []

# ============================================================ #
#                         채팅 및 상호작용                         #
# ============================================================ #

chat:
  # @coderabbitai 멘션 없이도 관련 PR 댓글에 자동으로 응답
  auto_reply: true

# ============================================================ #
#                    권한·요금제 안전 원칙                         #
# ============================================================ #

# Knowledge Base, 웹 검색, 외부 분석 도구는 요금제와 권한에 따라
# 제공 범위가 달라질 수 있으므로 강제로 활성화하지 않음.
# 사용 가능한 기본 기능은 CodeRabbit이 현재 플랜에 맞게 자동 적용함.
