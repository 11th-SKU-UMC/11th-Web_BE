# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# 리뷰와 답변에 사용할 기본 언어
language: "ko-KR"

# 리뷰어의 말투와 피드백 원칙
# > 블록은 여러 줄을 공백으로 이어 하나의 문자열로 전달함
tone_instructions: >
  초보자가 이해할 수 있도록 친절하고 간결하게 설명합니다.
  문제의 원인과 구체적인 수정 방향을 함께 제시하고,
  필수 수정과 선택 개선을 구분합니다.
  스타일보다 버그, 안정성, 보안, 성능, 유지보수성을 우선합니다.
  코드 식별자는 원문을 유지하고 나머지는 한국어로 작성합니다.
  정답 코드를 통째로 제공하기보다 스스로 고칠 수 있는 힌트를 우선합니다.

# Pull Request 리뷰 설정
reviews:
  # 과도하게 엄격하지 않고 실질적인 문제를 중심으로 리뷰
  profile: "chill"

  # CodeRabbit의 자동 승인 워크플로우를 사용하지 않음
  request_changes_workflow: false

  # PR 전체 변경 사항의 요약을 제공
  high_level_summary: true

  # 긴 Walkthrough 영역을 기본적으로 접어서 표시
  collapse_walkthrough: true

  # 변경된 파일별 요약을 제공
  changed_files_summary: true

  # 코드 흐름 시퀀스 다이어그램을 생성하지 않음
  sequence_diagrams: false

  # 연결된 Issue 내용을 리뷰 맥락으로 활용
  assess_linked_issues: true

  # 관련 Issue 목록을 별도로 표시하지 않음
  related_issues: false

  # 관련 PR을 자동으로 탐색하지 않음
  related_prs: false

  # PR 라벨을 추천하지 않음
  suggested_labels: false

  # 추천 라벨을 자동으로 적용하지 않음
  auto_apply_labels: false

  # 리뷰어를 추천하지 않음
  suggested_reviewers: false

  # 추천 리뷰어를 자동으로 할당하지 않음
  auto_assign_reviewers: false

  # PR 요약에 시(poem)를 생성하지 않음
  poem: false

  # AI 에이전트가 바로 적용할 정답형 수정 프롬프트를 제공하지 않음
  enable_prompt_for_ai_agents: false

  # 자동 리뷰 실행 조건
  auto_review:
    # 조건에 맞는 PR을 자동으로 리뷰
    enabled: true

    # PR에 새 커밋이 push되면 변경된 부분을 중심으로 추가 리뷰
    auto_incremental_review: true

    # Draft PR은 리뷰하지 않고 Ready 상태가 된 뒤 리뷰
    drafts: false

    # PR 대상 브랜치가 main이 아니어도 모든 브랜치를 리뷰
    base_branches:
      - ".*"

# PR 댓글 대화 설정
chat:
  # 직접 멘션하지 않은 관련 댓글에도 자동으로 응답
  auto_reply: true
