spring:
  application:
    name: movie
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/movie;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  jackson:
    deserialization:
      accept-float-as-int: false
server:
  port: ${PORT:8080}
