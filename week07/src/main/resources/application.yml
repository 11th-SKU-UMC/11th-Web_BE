server:
  port: ${PORT:8080}
spring:
  datasource:
    url: jdbc:h2:file:./data/movie;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  jackson:
    deserialization:
      fail-on-unknown-properties: true
jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600}
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
