spring.application.name=library-api
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/umc2?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
# MySQL root 비밀번호가 있다면 DB_PASSWORD 환경변수를 지정하거나 아래 기본값을 변경하세요.
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
